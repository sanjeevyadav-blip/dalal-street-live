name: CI
on:
  pull_request:
  push: { branches: [main, staging] }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Product invariants
        run: npm run invariants
      # Build runs before the tests because tests/unit/build-output.test.js asserts on
      # dist/index.html — the artefact that actually deploys. With the old ordering it
      # found no dist and skipped itself, which is a gate that reports success without
      # checking anything.
      - name: Build
        run: npm run build
      - name: Unit + regression tests
        run: npm run test:coverage
      - name: Bundle size guard
        run: |
          SIZE=$(stat -c%s dist/index.html)
          echo "bundle: $SIZE bytes"
          [ "$SIZE" -lt 409600 ] || { echo "Bundle over 400KB"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }
