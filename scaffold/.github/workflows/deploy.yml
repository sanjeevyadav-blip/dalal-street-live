name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: cp src/manifest.json src/sw.js dist/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Two real failures happened before this existed:
  #  1. raw.githubusercontent.com served stale content and nearly caused a revert
  #  2. a commit landed but the Pages webhook never fired; old file served 20 min
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for propagation
        run: sleep 45
      - name: Smoke test the live site
        run: |
          URL="https://sanjeevyadav-blip.github.io/dalal-street-live/?ci=${{ github.sha }}"
          BODY=$(curl -sf "$URL") || { echo "site unreachable"; exit 1; }
          echo "$BODY" | grep -q "Dalal Street" || { echo "unexpected content"; exit 1; }
          echo "$BODY" | grep -q "manifest.json"  || { echo "PWA manifest missing"; exit 1; }
          echo "Live site verified."
      - name: Verify PWA assets
        run: |
          B="https://sanjeevyadav-blip.github.io/dalal-street-live"
          curl -sf "$B/manifest.json" > /dev/null || { echo "manifest 404"; exit 1; }
          curl -sf "$B/sw.js"         > /dev/null || { echo "sw.js 404";   exit 1; }

  deploy-worker:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'worker')
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
